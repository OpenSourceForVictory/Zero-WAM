<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Piper · 实时相机</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#0e141b;color:#e7eef5}*{box-sizing:border-box}body{margin:0}main{max-width:1700px;margin:auto;padding:40px 28px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px}.eyebrow{font-size:12px;letter-spacing:3px;color:#7dbcae}h1{font-size:30px;margin:10px 0}p{color:#92a3b4;font-size:14px;line-height:1.7}button,a{font:inherit;color:inherit}button{background:#1c2a37;border:1px solid #354858;border-radius:8px;padding:10px 16px;cursor:pointer}button:hover{background:#2b4051}button:focus-visible,a:focus-visible{outline:2px solid #87e1c5;outline-offset:4px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:#16212c;border:1px solid #2a3947;border-radius:14px;overflow:hidden}.card.top{border-color:#548b7f}.heading{display:flex;align-items:center;justify-content:space-between;padding:18px;gap:8px}h2{font-size:16px;margin:0}.badge{font-size:12px;color:#e6bd80}.badge.online{color:#87e1c5}.view{position:relative;background:#080d12;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden}.view img{width:100%;height:100%;object-fit:contain}.view.offline img{opacity:.2}.overlay{position:absolute;inset:0;display:none;place-items:center;color:#fff;background:#0a101755}.view.offline .overlay{display:grid}.foot{padding:16px 18px;display:flex;justify-content:space-between;font-size:12px;color:#92a3b4;gap:12px}.foot button{padding:5px 9px;font-size:12px}.serial{font-family:monospace;align-self:center}footer{display:flex;justify-content:space-between;margin-top:22px;color:#8092a3;font-size:13px;gap:15px}body.paused .view::after{content:'已暂停';position:absolute;top:12px;left:12px;background:#101820dd;padding:6px 10px;border-radius:6px}.card:fullscreen{display:flex;flex-direction:column}.card:fullscreen .view{flex:1;min-height:0;aspect-ratio:auto}.card:fullscreen img{position:absolute;inset:0}@media(max-width:1000px){.grid{grid-template-columns:1fr 1fr}.top{grid-column:1/-1;grid-row:1}.top .view{max-height:60vh}}@media(max-width:620px){main{padding:24px 14px}.grid{grid-template-columns:1fr}header{align-items:flex-start}h1{font-size:24px}footer{flex-direction:column}}
</style>
<main>
<header><div><div class="eyebrow">PIPER / 175</div><h1>实时相机</h1><p>顶部桌面全景与两路腕部画面</p></div><button id="pause" aria-pressed="false">暂停画面</button></header>
<div class="grid" id="grid"></div>
<footer><span>640 × 480 · 网页刷新最高约 10 FPS · 左腕 / 顶部 / 右腕</span><span id="summary" aria-live="polite">正在连接相机…</span></footer>
</main>
<script>
const cameras=[['CC1C810002Y','左腕相机（原 B）',false],['CC1C8100041','顶部 · 桌面全景',true],['CC1C8100015','右腕相机（原 A）',false]];
let paused=false;
const items=cameras.map(([serial,title,top])=>{
 const card=document.createElement('section');card.className='card'+(top?' top':'');
 card.innerHTML=`<div class="heading"><h2>${title}</h2><span class="badge">连接中</span></div><div class="view offline"><img alt="${title}实时画面"><div class="overlay">等待实时画面</div></div><div class="foot"><span class="serial">${serial}</span><button aria-label="全屏查看${title}">全屏</button></div>`;
 document.querySelector('#grid').append(card);
 card.querySelector('button').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else card.requestFullscreen?.().catch(()=>{});};
 const item={serial,card,img:card.querySelector('img'),badge:card.querySelector('.badge'),view:card.querySelector('.view'),url:null};
 async function refresh(){
  if(paused||document.hidden){setTimeout(refresh,300);return;}
  const started=performance.now();
  try{
   const response=await fetch(`/frame/${serial}.jpg?t=${Date.now()}`,{cache:'no-store',signal:AbortSignal.timeout(3000)});
   if(!response.ok)throw Error('unavailable');
   const blob=await response.blob();
   if(paused||document.hidden){setTimeout(refresh,300);return;}
   const url=URL.createObjectURL(blob),previous=item.url;item.url=url;item.img.src=url;
   if(previous)URL.revokeObjectURL(previous);
   item.view.classList.remove('offline');item.badge.className='badge online';item.badge.textContent='● 实时';
  }catch(e){item.view.classList.add('offline');item.badge.className='badge';item.badge.textContent='断开 · 重连中';}
  setTimeout(refresh,Math.max(20,100-(performance.now()-started)));
 }
 refresh();return item;
});
document.querySelector('#pause').onclick=()=>{paused=!paused;document.body.classList.toggle('paused',paused);const b=document.querySelector('#pause');b.textContent=paused?'继续查看':'暂停画面';b.setAttribute('aria-pressed',String(paused));};
async function health(){try{const r=await fetch('/health',{signal:AbortSignal.timeout(3000)});if(!r.ok)throw Error();const data=await r.json();const n=Object.values(data).filter(v=>v.online).length;document.querySelector('#summary').textContent=`${n} / 3 路相机在线`;for(const item of items){if(!data[item.serial]?.online){item.view.classList.add('offline');item.badge.className='badge';item.badge.textContent='相机离线';}}}catch{document.querySelector('#summary').textContent='无法连接工控机';}setTimeout(health,2000);}health();
</script>
</html>
